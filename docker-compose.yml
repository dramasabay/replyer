services:
  backend:
    build: ./backend
    container_name: replyer-backend
    restart: unless-stopped
    environment:
      - ADMIN_PHONE=${ADMIN_PHONE}
      - DATA_DIR=/app/data
    volumes:
      - backend_data:/app/data
    networks:
      - replyer_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: replyer-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8087:80"
    networks:
      - replyer_net

networks:
  replyer_net:
    driver: bridge

volumes:
  backend_data:
