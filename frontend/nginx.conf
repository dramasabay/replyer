server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers to protect against clickjacking, sniffing, and XSS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Every API route the frontend calls lives under one of these top-level
    # paths (see main.py) — proxy them straight to the FastAPI backend.
    # Everything else falls through to the static index.html (single-page app).
    location ~ ^/(auth|users|rules|admin)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Return JSON error responses for API routes so frontends never encounter HTML error pages
        error_page 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"detail":"Backend server is unavailable or restarting. Please try again in a few seconds."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
